{{- if and (ne .Values.profi.metricsTls.mode "off") .Values.profi.metricsTls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "profi.fullname" . }}-metrics-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "profi.labels" . | nindent 4 }}
spec:
  secretName: {{ include "profi.fullname" . }}-metrics-tls
  duration: {{ .Values.profi.metricsTls.certManager.duration | default "8760h" }}
  renewBefore: {{ .Values.profi.metricsTls.certManager.renewBefore | default "720h" }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    {{- if eq .Values.profi.metricsTls.mode "mtls" }}
    - client auth
    {{- end }}
  dnsNames:
    {{- if .Values.profi.metricsTls.certManager.dnsNames }}
    {{- toYaml .Values.profi.metricsTls.certManager.dnsNames | nindent 4 }}
    {{- else }}
    - {{ include "profi.fullname" . }}.{{ .Release.Namespace }}.svc
    - {{ include "profi.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
    {{- end }}
  issuerRef:
    name: {{ required "profi.metricsTls.certManager.issuerName is required" .Values.profi.metricsTls.certManager.issuerName }}
    kind: {{ .Values.profi.metricsTls.certManager.issuerKind | default "ClusterIssuer" }}
{{- end }}
